<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Крипто-Ферма</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛏️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1316;--panel:#141d21;--panel2:#1a262b;--line:#26363d;--tx:#e7efe9;--mut:#8aa0a2;--coin:#ffb627;--hash:#3de0c1;--bad:#ff5c6a;--good:#5be28a;
 --r:14px;--head:'Unbounded','Trebuchet MS',sans-serif;--body:'Onest','Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--tx);font-family:var(--body)}
body{min-height:100%;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
 background:radial-gradient(900px 500px at 85% -10%,#12363a55,transparent),radial-gradient(700px 400px at -10% 30%,#3a2a0a40,transparent),var(--bg)}
.wrap{max-width:1120px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
h1{font:700 22px var(--head);letter-spacing:-.5px;display:flex;align-items:center;gap:10px}
h1 i{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe08a,var(--coin) 55%,#b47a00);display:grid;place-items:center;font:700 15px var(--head);color:#5a3a00;font-style:normal;box-shadow:0 0 18px #ffb62755}
.btn{font:600 13px var(--body);color:var(--tx);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 13px;cursor:pointer;transition:transform .1s,border-color .2s,background .2s}
.btn:hover:not(:disabled){border-color:var(--hash)}.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--hash);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat small{color:var(--mut);font-size:12px;display:block;margin-bottom:4px}
.stat b{font:700 18px var(--head);letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat.cash b{color:var(--good)}.stat.coin b{color:var(--coin)}
.up{color:var(--good)}.down{color:var(--bad)}
.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:14px}
max-width:860px{.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{font:600 14px var(--head);margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 span{font:500 12px var(--body);color:var(--mut)}
canvas{width:100%;height:220px;display:block;border-radius:10px;background:#0f181b}
.sell{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.sell .btn{flex:1;min-width:80px}
.sell .main{background:var(--coin);color:#3b2700;border-color:var(--coin)}
.sell .main:hover:not(:disabled){background:#ffc84d;border-color:#ffc84d}
.alert{display:none;margin-bottom:14px;padding:12px 14px;border-radius:var(--r);background:#3a1218;border:1px solid var(--bad);color:#ffc9ce;font-size:14px}
.alert.on{display:block}
.farm{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:10px;min-height:44px}
.row .lbl{width:92px;font-size:12px;color:var(--mut);flex:none}
.units{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.unit{width:34px;height:40px;border-radius:7px;background:linear-gradient(#233238,#192428);border:1px solid var(--line);position:relative;display:grid;place-items:center}
.unit::after{content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--mut)}
.unit.on::after{background:var(--hash);box-shadow:0 0 6px


var(--hash);animation:blink 1.4s infinite}
.unit.hot::after{background:var(--coin);box-shadow:0 0 6px var(--coin)}
.fan{width:22px;height:22px;color:var(--mut)}
.unit.on .fan{color:var(--hash);animation:spin .5s linear infinite}
.unit.off .fan{animation:none}
.more{font-size:12px;color:var(--mut)}
.empty{font-size:13px;color:var(--mut)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:.35}}
.shop{display:grid;gap:10px}
.item{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
.item .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.item b{font:600 14px var(--head)}
.item .own{color:var(--mut);font-size:12px}
.spec{display:flex;gap:14px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.spec em{font-style:normal;color:var(--tx)}
.spec .h em{color:var(--hash)}.spec .p em{color:var(--coin)}
.act{display:flex;gap:8px}.act .btn{flex:1}
.mini{flex:none!important;width:44px}
.mini.offc{border-color:var(--bad);color:var(--bad)}
.manual{width:100%;padding:14px;font:600 14px var(--head);background:linear-gradient(135deg,#17413f,#1d5a50);border-color:#2a7a6a}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translate(-50%,30px);opacity:0;background:#1d2b30;border:1px solid var(--hash);padding:11px 16px;border-radius:12px;font-size:14px;max-width:92vw;text-align:center;transition:.3s;pointer-events:none;z-index:9}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.bad{border-color:var(--bad)}
prefers-reduced-motion:reduce{.unit.on .fan,.unit.on::after{animation:none}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab.on{background:var(--hash);color:#06231e;border-color:var(--hash)}
.pane{display:none;gap:10px}
.sub{font-size:12px;color:var(--mut);margin-top:10px;text-align:center}
.item p{font-size:12px;color:var(--mut);line-height:1.45}
</style>
</head>
<body>
<div class="wrap">
 <header>
  <h1><i>₣</i>Крипто-Ферма</h1>
  <button class="btn" id="reset">Начать заново</button>
 </header>

 <div class="alert" id="alertBox">Электричество отключено: на счёте нет денег для оплаты. Продай монеты или добудь вручную, чтобы запустить ферму.</div>

 <div class="stats">
  <div class="stat cash"><small>Баланс</small><b id="sCash">$0</b></div>
  <div class="stat coin"><small>Монеты FRM</small><b id="sCoins">0</b></div>
  <div class="stat"><small>Курс FRM</small><b id="sPrice">$0</b></div>
  <div class="stat"><small>Доход в секунду</small><b id="sInc" class="up">$0</b></div>
  <div class="stat"><small>Электричество в секунду</small><b id="sCost" class="down">$0</b></div>
  <div class="stat"><small>Чистая прибыль в секунду</small><b id="sNet">$0</b></div>
 </div>

 <div class="grid">
  <div>
   <div class="card">
    <h2>Курс FRM <span id="tarInfo"></span></h2>
    <canvas id="cvs"></canvas>
    <div class="sell">
     <button class="btn" data-s=".25">Продать 25%</button>
     <button class="btn" data-s=".5">Продать 50%</button>
     <button class="btn main" data-s="1">Продать всё</button>
    </div>
   </div>
   <div class="card">
    <h2>Твоя ферма <span id="hrInfo"></span></h2>
    <div class="farm" id="farm"></div>
   </div>
  </div>
  <div>
   <div class="card">
    <button class="btn manual" id="manual">Добыть вручную</button>
    <div class="sub" id="manualInfo"></div>
   </div>
   <div class="card">
    <h2>Магазин</h2>
    <div class="tabs" id="tabs"></div>
    <div id="shop"></div>
   </div>
  </div>
 </div>
</div>
<div id="toast"></div>

<script>
addEventListener('error',e=>{let d=document.getElementById('err');if(!d){d=document.createElement('div');d.id='err';d.style.cssText='position:fixed;top:0;left:0;right:0;background:#a22;color:#fff;padding:8px;font:12px monospace;z-index:99';document.body.appendChild(d)}d.textContent='Ошибка: '+e.message+' (строка '+e.lineno+')'});

const RIGS=[
 {id:'gpu',name:'Видеокарта GTX',h:1,p:.4,c:60},
 {id:'rtx',name:'RTX-стойка',h:


6,p:2,c:400},
 {id:'asic',name:'ASIC-майнер',h:35,p:10,c:2500},
 {id:'cloud',name:'Облачная шахта',h:200,p:50,c:15000}
];
const PCS=[
 {n:'Старый ноутбук',d:'Греется и шумит, но майнить на нём можно.',c:0,m:0},
 {n:'Офисный ПК',d:'Тихий системник с нормальным блоком питания.',c:1200,m:.10},
 {n:'Игровой ПК',d:'Мощный процессор и быстрая память: все карты работают стабильнее.',c:6000,m:.25},
 {n:'Рабочая станция',d:'Серверная плата, память с коррекцией ошибок и отличное охлаждение.',c:30000,m:.5},
 {n:'Суперкомпьютер',d:'Целый шкаф с жидкостным контуром. Ферма летает.',c:150000,m:1}
];
const UPS=[
 {id:'ram',tab:'pc',name:'Оперативная память',d:'Ещё одна планка. Хешрейт +5% за уровень.',c:300,max:8,m:1.7},
 {id:'cpu',tab:'pc',name:'Процессор',d:'Ручная добыча +50% за уровень.',c:500,max:6,m:1.9},
 {id:'psu',tab:'pc',name:'Блок питания 80+ Gold',d:'Потребление −5% за уровень.',c:900,max:5,m:2},
 {id:'chair',tab:'life',name:'Кресло геймера',d:'Рука не устаёт: ручная добыча +50%.',c:700,max:1,m:1},
 {id:'cat',tab:'life',name:'Кот-талисман',d:'Спит на тёплом системнике и приносит удачу. Хешрейт +5%.',c:5000,max:1,m:1},
 {id:'av',tab:'life',name:'Антивирус',d:'Отбивает атаки хакеров, которые крадут часть монет.',c:1500,max:1,m:1},
 {id:'cool',tab:'energy',name:'Жидкостное охлаждение',d:'Потребление −15% за уровень.',c:800,max:3,m:2.2},
 {id:'solar',tab:'energy',name:'Солнечные панели',d:'Тариф −20% за уровень.',c:3000,max:3,m:2.6},
 {id:'ac',tab:'energy',name:'Кондиционер',d:'Ферма не перегревается: потребление −10% за уровень.',c:2000,max:2,m:3}
];
const TABS=[['rigs','Майнеры'],['pc','Компьютер'],['life','Быт'],['energy','Энергия']];
const KEY='cryptofarm_v1',COIN_PER_HASH=.001,COFFEE_COST=40;

function genHist(p){const a=[];for(let i=0;i<120;i++){a.unshift(p);p=Math.max(120,p*(1+(Math.random()-.5)*.06)+(1000-p)*.01)}return a}
const fresh=()=>{const p=1000;return{cash:100,coins:0,price:p,mean:1000,trend:0,tariff:.7,tMul:1,tLeft:0,coffee:0,own:{},off:{},lvl:{},hist:genHist(p),evIn:45}};
function loadState(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.hist){const f=Object.assign(fresh(),s);if(Math.max(...f.hist)-Math.min(...f.hist)<1)f.hist=genHist(f.price);return f}}catch(e){}return fresh()}
let S=loadState();
function saveState(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const $=id=>document.getElementById(id);
const fmt=(n,d=0)=>{const a=Math.abs(n);if(a>=1e9)return(n/1e9).toFixed(2)+'B';if(a>=1e6)return(n/1e6).toFixed(2)+'M';if(a>=1e5)return(n/1e3).toFixed(1)+'K';return n.toLocaleString('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d})};
const usd=(n,d=0)=>(n<0?'−':'')+'$'+fmt(Math.abs(n),d);
const own=id=>S.own[id]||0,lvl=id=>S.lvl[id]||0;
const rigCost=r=>Math.round(r.c*Math.pow(1.15,own(r.id)));
const upCost=u=>Math.round(u.c*Math.pow(u.m,lvl(u.id)));
const active=r=>S.off[r.id]?0:own(r.id);
const coffeeOn=()=>S.coffee>0;
const hMul=()=>(1+PCS[lvl('pc')].m)*(1+.05*lvl('ram'))*(1+.05*lvl('cat'))*(coffeeOn()?1.15:1);
const pMul=()=>(1-.15*lvl('cool'))*(1-.05*lvl('psu'))*(1-.1*lvl('ac'));
const manualPow=()=>.003*(1+.5*lvl('cpu'))*(1+.5*lvl('chair'))*(coffeeOn()?2:1);
const hash=()=>RIGS.reduce((a,r)=>a+active(r)*r.h,0)*hMul();
const power=()=>RIGS.reduce((a,r)=>a+active(r)*r.p,0)*pMul();
const tariff=()=>S.tariff*S.tMul*(1-.2*lvl('solar'));
const costS=()=>power()[id27159981|);
let blackout=false;
const incS=(]=>blackout?0:hash()*COIN_PER_HASH*S.price;
const netNow=()=>incS()-(blackout?0:costS());

function toast(t,bad){const e=$('toast');e.textContent=t;e.className='on'+(bad?' bad':'');clearTimeout(toast.t);toast.t=setTimeout(()=>e.className=bad?'bad':'',3200)}

/* ---------- shop ---------- */
const fanSVG='<svg class="fan" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="2.2"/><path d="M12 10c-1-4 0-8 3-8s2 5-3 8zM14 12c4-1 8 0 8 3s-5 2-8-3zM12 14c1 4 0 8-3 8s-2-5 3-8zM10 12c-4 1-8 0-8-3s5-2 8 3z" opacity=".85"/></svg>';
let tab='rigs';
const upsHtml=t=>UPS.filter(u=>u.


tab===t).map(u=>`<div class="item"><div class="top"><b>${u.name}</b><span class="own" id="ul_${u.id}"></span></div><p>${u.d}</p><div class="act"><button class="btn" id="ub_${u.id}"></button></div></div>`).join('');
function showTab(){
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 document.querySelectorAll('.pane').forEach(p=>p.style.display=p.dataset.p===tab?'grid':'none');
}
function buildShop(){
 $('tabs').innerHTML=TABS.map(t=>`<button class="btn tab" data-t="${t[0]}">${t[1]}</button>`).join('');
 document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;showTab()});
 const rigs=RIGS.map(r=>`<div class="item"><div class="top"><b>${r.name}</b><span class="own" id="o_${r.id}"></span></div>
  <div class="spec"><span class="h">Хешрейт <em>${r.h}</em></span><span class="p">Мощность <em id="pw_${r.id}"></em></span><span>Добыча <em id="rv_${r.id}"></em></span></div>
  <div class="act"><button class="btn" id="b_${r.id}"></button><button class="btn mini" id="t_${r.id}" title="Включить или выключить">⏻</button></div></div>`).join('');
 const pc=`<div class="item"><div class="top"><b id="pcName"></b><span class="own">Твой компьютер</span></div><p id="pcDesc"></p>
  <div class="spec"><span class="h">Бонус к хешрейту <em id="pcBonus"></em></span></div><p id="pcNext"></p><div class="act"><button class="btn" id="pcB"></button></div></div>`;
 const cof=`<div class="item"><div class="top"><b>Кофе</b><span class="own" id="coffeeL"></span></div><p>Бодрит: хешрейт +15% и ручная добыча ×2 на 60 секунд. Чашки складываются, максимум 5 минут.</p><div class="act"><button class="btn" id="coffeeB">Выпить кофе за ${usd(COFFEE_COST)}</button></div></div>`;
 $('shop').innerHTML=`<div class="pane" data-p="rigs">${rigs}</div><div class="pane" data-p="pc">${pc}${upsHtml('pc')}</div><div class="pane" data-p="life">${cof}${upsHtml('life')}</div><div class="pane" data-p="energy">${upsHtml('energy')}</div>`;
 RIGS.forEach(r=>{$('b_'+r.id).onclick=()=>{const c=rigCost(r);if(S.cash>=c){S.cash-=c;S.own[r.id]=own(r.id)+1;drawFarm();ui()}};
  $('t_'+r.id).onclick=()=>{S.off[r.id]=!S.off[r.id];ui()}});
 UPS.forEach(u=>{$('ub_'+u.id).onclick=()=>{const c=upCost(u);if(lvl(u.id)<u.max&&S.cash>=c){S.cash-=c;S.lvl[u.id]=lvl(u.id)+1;ui()}}});
 $('pcB').onclick=()=>{const l=lvl('pc');if(l<PCS.length-1&&S.cash>=PCS[l+1].c){S.cash-=PCS[l+1].c;S.lvl.pc=l+1;toast('Новый компьютер: '+PCS[l+1].n);ui()}};
 $('coffeeB').onclick=()=>{if(S.cash>=COFFEE_COST){S.cash-=COFFEE_COST;S.coffee=Math.min(300,S.coffee+60);toast('Кофе выпит: бодрость включена');ui()}};
 showTab();
}
function drawFarm(){
 const rows=RIGS.filter(r=>own(r.id)>0).map(r=>{const n=own(r.id),show=Math.min(n,10);
  let u='';for(let i=0;i<show;i++)u+=`<div class="unit" data-r="${r.id}">${fanSVG}</div>`;
  return`<div class="row"><div class="lbl">${r.name}</div><div class="units">${u}${n>show?`<span class="more">+${n-show}</span>`:''}</div></div>`});
 $('farm').innerHTML=rows.join('')||'<div class="empty">Ферма пуста. Купи первую видеокарту или добудь монеты вручную.</div>';
}
function unitState(){
 const hot=netNow()<0;
 document.querySelectorAll('.unit').forEach(e=>{const off=S.off[e.dataset.r];e.className='unit '+(off||blackout?'off':'on')+(!off&&!blackout&&hot?' hot':'')});
}

/* ---------- economy ---------- */
function tick(dt){
 const cost=costS()*dt;
 if(cost>0&&S.cash<cost){blackout=true}else{blackout=false;S.cash-=cost;S.coins+=hash()*COIN_PER_HASH*dt}
 if(S.tLeft>0){S.tLeft-=dt;if(S.tLeft<=0){S.tMul=1;toast('Тариф вернулся к обычному')}}
 if(S.coffee>0){S.coffee=Math.max(0,S.coffee-dt)}
}
function priceStep(){
 S.trend*=.9;
 S.mean=Math.max(300,Math.min(4000,S.mean*(1+(Math.random()-.5)*.01)));
 S.price=Math.max(80,S.price*(1+(Math.random()-.5)*.07+S.trend)+(S.mean-S.price)*.015);
 S.hist.push(S.price);S.hist.shift();
}
function randomEvent(){
 const e=Math.random();
 if(e<.2){S.trend=.04;toast('Хайп вокруг FRM: курс растёт!')}
 else if(e<.38){S.


price*=.65;toast('Крах рынка: курс упал на 35%',true)}
 else if(e<.58){S.tMul=1.9;S.tLeft=45;toast('Энергетики подняли тариф почти вдвое на 45 секунд',true)}
 else if(e<.76){S.tMul=.55;S.tLeft=45;toast('Ночной тариф: электричество вдвое дешевле на 45 секунд')}
 else if(e<.88){S.price*=1.5;toast('Крупный фонд купил FRM: курс +50%')}
 else if(lvl('av')){toast('Антивирус отбил атаку хакеров')}
 else{const l=S.coins*.15;S.coins-=l;toast('Хакеры украли '+fmt(l,4)+' FRM. Нужен антивирус',true)}
}

/* ---------- UI ---------- */
function setUp(u){const l=lvl(u.id),b=$('ub_'+u.id);
 $('ul_'+u.id).textContent=u.max===1?(l?'Куплено':''):'Уровень '+l+' из '+u.max;
 if(l>=u.max){b.textContent=u.max===1?'Куплено':'Максимум';b.disabled=true}else{const c=upCost(u);b.textContent='Купить за '+usd(c);b.disabled=S.cash<c}}
function ui(){
 $('sCash').textContent=usd(S.cash,S.cash<100?2:0);
 $('sCoins').textContent=fmt(S.coins,4);
 const prev=S.hist[S.hist.length-2]||S.price,ch=(S.price/prev-1)*100;
 $('sPrice').innerHTML=usd(S.price)+` <small class="${ch>=0?'up':'down'}" style="font:500 12px var(--body)">${ch>=0?'▲':'▼'} ${Math.abs(ch).toFixed(1)}%</small>`;
 const inc=incS(),c=blackout?0:costS(),net=inc-c;
 $('sInc').textContent=usd(inc,2);$('sCost').textContent=usd(c,2);
 $('sNet').textContent=usd(net,2);$('sNet').className=net>=0?'up':'down';
 $('tarInfo').textContent='Тариф: '+usd(tariff(),2)+' за кВт/с'+(S.tMul>1?' (повышен)':S.tMul<1?' (скидка)':'');
 $('hrInfo').textContent='Хешрейт: '+fmt(hash(),1)+' · '+fmt(power(),1)+' кВт';
 $('alertBox').classList.toggle('on',blackout);
 $('manualInfo').textContent='+'+fmt(manualPow(),4)+' FRM за нажатие'+(coffeeOn()?' (кофе: бодрость ещё '+Math.ceil(S.coffee)+' с)':'');
 const canSell=S.coins>0.00001;document.querySelectorAll('[data-s]').forEach(b=>b.disabled=!canSell);
 RIGS.forEach(r=>{const cst=rigCost(r);
  $('o_'+r.id).textContent='Куплено: '+own(r.id);
  $('pw_'+r.id).textContent=fmt(r.p*pMul(),2)+' кВт';
  $('rv_'+r.id).textContent=usd(r.h*hMul()*COIN_PER_HASH*S.price,2)+'/с';
  const b=$('b_'+r.id);b.textContent='Купить за '+usd(cst);b.disabled=S.cash<cst;
  const t=$('t_'+r.id);t.classList.toggle('offc',!!S.off[r.id]);t.disabled=!own(r.id)});
 UPS.forEach(setUp);
 const l=lvl('pc'),nx=PCS[l+1];
 $('pcName').textContent=PCS[l].n;$('pcDesc').textContent=PCS[l].d;$('pcBonus').textContent='+'+Math.round(PCS[l].m*100)+'%';
 $('pcNext').textContent=nx?'Следующий: «'+nx.n+'». '+nx.d+' Бонус +'+Math.round(nx.m*100)+'%.':'Это лучший компьютер.';
 $('pcB').textContent=nx?'Купить «'+nx.n+'» за '+usd(nx.c):'Максимум';$('pcB').disabled=!nx||S.cash<nx.c;
 $('coffeeL').textContent=coffeeOn()?'Бодрость: '+Math.ceil(S.coffee)+' с':'';
 $('coffeeB').disabled=S.cash<COFFEE_COST;
 unitState();
}

/* ---------- chart ---------- */
const cv=$('cvs'),cx=cv.getContext('2d');
function chart(){
 const dpr=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
 if(!w||!h)return;
 if(cv.width!==Math.round(w*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
 cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,w,h);
 const d=S.hist,mn=Math.min(...d)*.95,mx=Math.max(...d)*1.05,pad=10,cw=w-62;
 const X=i=>i/(d.length-1)*cw,Y=v=>pad+(1-(v-mn)/(mx-mn))*(h-pad*2);
 cx.font='11px sans-serif';cx.fillStyle='#8aa0a2';cx.strokeStyle='#1e2d33';cx.lineWidth=1;
 for(let i=0;i<4;i++){const v=mn+(mx-mn)*i/3,y=Y(v);cx.beginPath();cx.moveTo(0,y);cx.lineTo(cw,y);cx.stroke();cx.fillText('$'+Math.round(v),cw+6,y+4)}
 const up=d[d.length-1]>=d[0],col=up?'#5be28a':'#ff5c6a';
 const g=cx.createLinearGradient(0,0,0,h);g.addColorStop(0,col+'55');g.addColorStop(1,col+'00');
 cx.beginPath();d.forEach((v,i)=>i?cx.lineTo(X(i),Y(v)):cx.moveTo(X(i),Y(v)));
 cx.lineTo(cw,h);cx.lineTo(0,h);cx.closePath();cx.fillStyle=g;cx.fill();
 cx.beginPath();d.forEach((v,i)=>i?cx.lineTo(X(i),Y(v)):cx.moveTo(X(i),Y(v)));
 cx.strokeStyle=col;cx.lineWidth=2;cx.lineJoin='round';cx.stroke();
 const lx=X(d.length-1),ly=Y(d[d.length-1]);
 cx.beginPath();cx.arc(l


x,ly,4,0,7);cx.fillStyle=col;cx.fill();
 cx.beginPath();cx.arc(lx,ly,8,0,7);cx.strokeStyle=col+'66';cx.stroke();
}

/* ---------- actions ---------- */
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{
 const q=S.coins*parseFloat(b.dataset.s);S.coins-=q;const g=q*S.price;S.cash+=g;toast('Продано на '+usd(g,2));ui()});
$('manual').onclick=()=>{S.coins+=manualPow();ui()};
$('reset').onclick=()=>{if(confirm('Стереть прогресс и начать заново?')){S=fresh();drawFarm();ui();chart();saveState()}};

/* ---------- loop ---------- */
buildShop();drawFarm();ui();
requestAnimationFrame(chart);
let last=performance.now(),acc=0,evT=0;
setInterval(()=>{
 const n=performance.now(),dt=Math.min((n-last)/1000,5);last=n;
 tick(dt);acc+=dt;evT+=dt;
 if(acc>=1){acc-=1;priceStep();chart()}
 if(evT>=S.evIn){evT=0;S.evIn=40+Math.random()*30;randomEvent()}
 ui();
},200);
setInterval(saveState,5000);
addEventListener('beforeunload',saveState);
addEventListener('resize',chart);
</script>
</body>
</html>
